# claude-kit optional MCP integrations. Selected servers are written into a project-root `.mcp.json`
# ONLY when chosen at init (default: none). Configs use ${ENV} placeholders — no credentials are ever
# generated. Fill the referenced env vars (e.g. in your shell or .env) before using a server.
#
# SUPPLY CHAIN: every server below is THIRD-PARTY code (an npx package or a hosted HTTP endpoint) with
# its own maintainers, trust, and licensing model — claude-kit only references it, never vendors or
# audits it. The `npx -y <pkg>@<version>` commands are pinned to an exact version (snapshot 2026-06-23)
# rather than a moving `@latest`, so an install is reproducible and a fresh upstream release can't
# silently change what runs. Bump these deliberately (and review the changelog) — do not switch back
# to `@latest`. See SECURITY.md and the README "MCP integrations" note.

version: 1

servers:
  github:
    label: "GitHub (issues, PRs, repos)"
    # NOTE: the official @modelcontextprotocol/server-github npm package is archived/deprecated upstream
    # (GitHub now ships a Go `github-mcp-server`). Pinned to its last published version for a stable
    # install; switch to the maintained server in a future kit release if you need newer features.
    config:
      type: stdio
      command: npx
      args: ["-y", "@modelcontextprotocol/server-github@2025.4.8"]
      env:
        GITHUB_PERSONAL_ACCESS_TOKEN: "${GITHUB_PERSONAL_ACCESS_TOKEN}"
  linear:
    label: "Linear (issues)"
    config:
      type: http
      url: "https://mcp.linear.app/mcp"
  jira:
    label: "Jira (issues)"
    config:
      type: stdio
      command: npx
      args: ["-y", "mcp-atlassian@2.1.0"]
      env:
        JIRA_URL: "${JIRA_URL}"
        JIRA_API_TOKEN: "${JIRA_API_TOKEN}"
  postgres:
    label: "PostgreSQL (query the database)"
    # NOTE: @modelcontextprotocol/server-postgres is archived/deprecated upstream; pinned to its last
    # published version for a stable install. Consider a maintained Postgres MCP server going forward.
    config:
      type: stdio
      command: npx
      args:
        ["-y", "@modelcontextprotocol/server-postgres@0.6.2", "${DATABASE_URL}"]
  mongodb:
    label: "MongoDB (query the database)"
    config:
      type: stdio
      command: npx
      args: ["-y", "mongodb-mcp-server@1.13.0"]
      env:
        MDB_MCP_CONNECTION_STRING: "${MONGODB_URI}"
  playwright:
    label: "Playwright (browser automation / E2E)"
    config:
      type: stdio
      command: npx
      args: ["-y", "@playwright/mcp@0.0.76"]
  docs:
    label: "Docs / Context7 (live library docs)"
    config:
      type: http
      url: "https://mcp.context7.com/mcp"
    # Companion (no MCP needed): `library-skills` (https://library-skills.io, MIT) installs a
    # dependency's *author-shipped, version-synced* skills into `.claude/skills/` via managed symlinks
    # (`uvx library-skills` / `npx library-skills`) so the agent uses a library's CURRENT API instead of
    # stale training-data patterns — for the (growing) set of libraries that ship skills; Context7 above
    # covers everything else with live docs. Both are referenced (not bundled). See the
    # `dependency-verification` and `library-review` skills for where this sits in the dependency lifecycle.
  # Sentry (github.com/getsentry/sentry-mcp) — official, vendor-maintained MCP for production error
  # monitoring / issue triage: top unresolved issues, stacktraces, performance & trace data, and Seer
  # root-cause analysis. Fills the error-monitoring gap the `incident-responder` + `observability-engineer`
  # agents already expect (incident-responder.md: "If an error-tracking / monitoring integration is
  # connected (e.g. via an MCP), pull the top unresolved issue + event trend"). NOT bundled — only
  # referenced; the hosted HTTP endpoint below uses OAuth and generates NO credentials. The server's
  # source is FSL-1.1-Apache-2.0 (source-available; converts to Apache-2.0 two years after each
  # release) — flagged in the label like the repowise AGPL note; this entry references only the
  # OAuth-hosted service, not the source. Self-hosted/token alternative (instead of the http url):
  #   command: npx, args: ["-y", "@sentry/mcp-server@0.36.0"], env: SENTRY_ACCESS_TOKEN: "${SENTRY_ACCESS_TOKEN}".
  sentry:
    label: "Sentry (error monitoring / issue triage; source-available FSL-1.1)"
    config:
      type: http
      url: "https://mcp.sentry.dev/mcp"
  # Repowise (github.com/repowise-dev/repowise) — optional codebase-intelligence engine exposing an
  # MCP server: deterministic hotspots (churn × complexity), change-risk, co-change coupling, dead
  # code, and a dependency graph. NOT bundled (claude-kit only references it): it is AGPL-3.0, so
  # install it separately (`pip install repowise`) and index the repo once (`repowise init`) before
  # first use. Point it at the repo via the env var below (e.g. `export REPOWISE_PROJECT_ROOT=$(pwd)`).
  repowise:
    label: "Repowise codebase intelligence (AGPL-3.0; needs `pip install repowise` + `repowise init`)"
    config:
      type: stdio
      command: repowise
      args: ["mcp", "${REPOWISE_PROJECT_ROOT}", "--transport", "stdio"]
