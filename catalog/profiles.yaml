# claude-kit SDLC profiles — which slice of the agent/skill superset and which quality gates
# and hooks are activated. Profiles are the ONLY thing that makes lean ⊊ standard ⊊ enterprise.
#
# Each profile lists agents / skills / gates / hooks. `inherit: <profile>` composes on top of
# another profile (this profile's lists are unioned with the inherited ones). The special value
# `all` means "every available item discovered in the payload" (agents/, skills/, hooks/).
#
# ORDER CONVENTION for `gates:` — gates are the one list where order is data: the resolved list
# lands execution-ordered in stack-catalog.snapshot.yaml and `claude-kit pipeline close-gate`
# enforces it. A profile that inherits MUST therefore declare its FULL gate list in execution
# order (standard and enterprise below do); the resolver keeps the profile's own order and lets
# inherited gates only fill gaps.
#
# Agent and skill names must match files in agents/ and skills/. Hook ids map to entries in the
# hook registry in scaffold.py (script-backed hooks copy their .sh; inline/prompt hooks don't).

version: 1
default: standard

profiles:
  lean:
    label: "Lean — fast track, minimal gates"
    agents: [orchestrator, developer, sdlc-code-reviewer, tester, pr-raiser]
    skills:
      - sdlc
      - execute
      - incremental-implementation
      - test-driven-development
      - debugging-and-error-recovery
      - git-workflow-and-versioning
      - code-review-and-quality
      - using-agent-skills
    gates: [code-review, build-green]
    hooks: [load-continuity, lint-fix]

  standard:
    label: "Standard — full SDLC, parallel lanes, security gate"
    inherit: lean
    agents:
      - spec-doc-writer
      - story-planner
      - ui-designer
      - technical-architect
      - em-reviewer
      - senior-backend-dev
      - senior-frontend-dev
      - merge-reviewer
      - unit-tester
      - e2e-tester
      - senior-tester
      - devils-advocate
      - acceptance-reviewer
      - security-reviewer
      - secret-scanner
      - dependency-scanner
      - owasp-reviewer
      - policy-validator
      # pentest-scanner is the optional DYNAMIC scanner (drives Strix/Shannon/ZAP). The
      # security-reviewer dispatches it only on request + an authorized non-prod target; it is
      # non-blocking (returns SKIPPED) when its preflight fails, so the security-clear gate is
      # unchanged for projects without pentest tooling.
      - pentest-scanner
    skills:
      - spec-driven-development
      - planning-and-task-breakdown
      - interview-me
      - idea-refine
      - scope
      # NOTE: the frontend-specific skills (frontend-ui-engineering, component-design, ui-ux-design,
      # unit-test, api-integration, manual-test) are NOT core — they ride catalog/stacks.yaml's
      # react `skills:` union, so they install only when a frontend stack is selected.
      - api-and-interface-design
      - security-and-hardening
      - security-verification
      - documentation-and-adrs
      - decision
      - remember
      - context-engineering
      - source-driven-development
      - doubt-driven-development
      - code-simplification
      - refresh-docs
      - smoke-test
      - browser-testing-with-devtools
      - performance-optimization
      - load-testing
      - incident-postmortem
      # deploy = the configuration-driven deploy-and-verify loop (interviews once, persists to
      # .claude/config/deploy.yaml). Deploy execution stays gated by the user's permission settings.
      - deploy
      - threat-model
      # Pentest skills — driven by the pentest-scanner agent for dynamic penetration testing.
      # Document-only drivers for externally-installed tools; safe to install (no tool runs until
      # explicitly invoked against an authorized target).
      - strix-ai-pentest
      - shannon-ai-pentest
      - pentesterflow-pentest
      - zap-vapt-scanning
      - accessibility-review
      - over-engineering-review
      - simplification-debt
      - task-tracker-sync
      - ticketing-and-traceability
      - bug-hunt
      - test-plan-review
    # contract-clear self-skips when the stack exposes no API contract surface, so it is inert for
    # non-API projects on standard while enforcing backward-compatibility for API-exposing backends
    # (e.g. FastAPI). Promoted from enterprise-only per brief #2 P0-1 — see CHANGELOG 0.13.0.
    gates: [spec-complete, em-approved, code-review, build-green, test-coverage, security-clear, contract-clear]
    # NOTE: the agent-side capture hooks (capture-learnings / -catchup / -stop) are deliberately NOT
    # listed here — they are installed by the init-time `capture_mode` choice via catalog/capture.yaml
    # (see catalog._apply_capture_mode), not by profile membership. load-learnings (recall) stays.
    # capture-ticket-telemetry rides with the ticketing-and-traceability skill above: it is unrelated
    # to capture_mode, self-throttles, and no-ops until a ticket store exists.
    hooks: [load-continuity, load-learnings, load-autonomy, guard-rm-rf, guard-push-main, guard-destructive-git, protect-secrets, guard-commit-secrets, warn-shared-modules, warn-llm-io, lint-fix, type-check, capture-ticket-telemetry]

  enterprise:
    label: "Enterprise — adds DevOps, Observability, full audit + acceptance"
    inherit: standard
    agents:
      - devops-engineer
      - observability-engineer
      - auditor
      - incident-responder
      - risk-classifier
    skills: all
    gates: [spec-complete, em-approved, code-review, build-green, test-coverage, security-clear, contract-clear, pipeline-green, observability-ready, acceptance]
    hooks: all
