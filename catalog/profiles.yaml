# claude-kit SDLC profiles — which slice of the agent/skill superset and which quality gates
# and hooks are activated. Profiles are the ONLY thing that makes lean ⊊ standard ⊊ enterprise.
#
# Each profile lists agents / skills / gates / hooks. `inherit: <profile>` composes on top of
# another profile (this profile's lists are unioned with the inherited ones). The special value
# `all` means "every available item discovered in the payload".
#
# `all` is appropriate for `hooks:` — the hook registry is small, closed, and every hook is
# stack-neutral, so "all of them" is a real statement of intent. It is NOT appropriate for
# `skills:`: skills are numerous and many are stack-flavored, so `all` silently turned every new
# directory in skills/ into an enterprise install and put it in the skill picker. Enumerate skills;
# gate the stack-specific ones through catalog/stacks.yaml's `skills:` union instead.
#
# ORDER CONVENTION for `gates:` — gates are the one list where order is data: the resolved list
# lands execution-ordered in stack-catalog.snapshot.yaml and `claude-kit pipeline close-gate`
# enforces it. A profile that inherits MUST therefore declare its FULL gate list in execution
# order (standard and enterprise below do); the resolver keeps the profile's own order and lets
# inherited gates only fill gaps.
#
# Agent and skill names must match files in agents/ and skills/. Hook ids map to entries in the
# hook registry in scaffold.py (script-backed hooks copy their .sh; inline/prompt hooks don't).

version: 2
default: standard

# Canonical gate policy. Profile lists below decide only membership + execution order; this mapping
# decides whether a selected gate is required or may be marked not applicable, and under which
# machine-checked condition. Keep each gate here exactly once so the resolver and pipeline consume
# one source of truth rather than inferring policy from prose or gate names.
gate_definitions:
  spec-complete:
    requirement: required
    skippable: false
    skip_conditions: []
  em-approved:
    requirement: required
    skippable: false
    skip_conditions: []
  code-review:
    requirement: required
    skippable: false
    skip_conditions: []
  build-green:
    requirement: required
    skippable: false
    skip_conditions: []
  contract-clear:
    requirement: conditional
    skippable: true
    skip_conditions: [no-api-contract-surface]
  test-coverage:
    requirement: required
    skippable: false
    skip_conditions: []
  security-clear:
    requirement: required
    skippable: false
    skip_conditions: []
  pipeline-green:
    requirement: conditional
    skippable: true
    skip_conditions: [no-deploy-surface]
  observability-ready:
    requirement: conditional
    skippable: true
    skip_conditions: [no-observable-surface]
  acceptance:
    requirement: required
    skippable: false
    skip_conditions: []
  accessibility-clear:
    requirement: conditional
    skippable: true
    skip_conditions: [no-ui-surface]

profiles:
  lean:
    label: "Lean — fast track, minimal gates"
    agents:
      - orchestrator
      - risk-classifier
      - developer
      - sdlc-code-reviewer
      - tester
      - pr-raiser
      - maker-checker-maker
      - maker-checker-reviewer
    skills:
      - sdlc
      - execute
      - maker-checker
      - incremental-implementation
      - test-driven-development
      - debugging-and-error-recovery
      - git-workflow-and-versioning
      - code-review-and-quality
      - using-agent-skills
    gates: [code-review, build-green]
    # verify-continuity-writeback is listed wherever load-continuity is: a profile that reads
    # working memory at session start but never checks it was written back pays continuity's cost
    # and gets none of its resumability.
    hooks: [load-continuity, verify-continuity-writeback, lint-fix]

  standard:
    label: "Standard — full SDLC, parallel lanes, security gate"
    inherit: lean
    agents:
      - spec-doc-writer
      - story-planner
      - ui-designer
      - technical-architect
      - em-reviewer
      - senior-backend-dev
      - senior-frontend-dev
      - merge-reviewer
      - unit-tester
      - e2e-tester
      - senior-tester
      - devils-advocate
      - acceptance-reviewer
      - security-reviewer
      - secret-scanner
      - dependency-scanner
      - owasp-reviewer
      - policy-validator
      # pentest-scanner is the optional DYNAMIC scanner (drives Strix/Shannon/ZAP). The
      # security-reviewer dispatches it only on request + an authorized non-prod target; it is
      # non-blocking (returns SKIPPED) when its preflight fails, so the security-clear gate is
      # unchanged for projects without pentest tooling.
      - pentest-scanner
    skills:
      - spec-driven-development
      - planning-and-task-breakdown
      - interview-me
      - idea-refine
      - scope
      # NOTE: the frontend-specific skills (frontend-ui-engineering, component-design, ui-ux-design,
      # unit-test, api-integration, manual-test) are NOT core — they ride catalog/stacks.yaml's
      # react `skills:` union, so they install only when a frontend stack is selected.
      - api-and-interface-design
      - security-and-hardening
      - security-verification
      - documentation-and-adrs
      - decision
      - remember
      - context-engineering
      - source-driven-development
      - doubt-driven-development
      - code-simplification
      - refresh-docs
      - smoke-test
      - browser-testing-with-devtools
      - performance-optimization
      - load-testing
      - incident-postmortem
      # deploy = the configuration-driven deploy-and-verify loop (interviews once, persists to
      # .claude/config/deploy.yaml). Deploy execution stays gated by the user's permission settings.
      - deploy
      - threat-model
      # Pentest skills — driven by the pentest-scanner agent for dynamic penetration testing.
      # Document-only drivers for externally-installed tools; safe to install (no tool runs until
      # explicitly invoked against an authorized target).
      - strix-ai-pentest
      - shannon-ai-pentest
      - pentesterflow-pentest
      - zap-vapt-scanning
      - accessibility-review
      - over-engineering-review
      - simplification-debt
      - task-tracker-sync
      - ticketing-and-traceability
      - bug-hunt
      - test-plan-review
    # contract-clear self-skips when the stack exposes no API contract surface, so it is inert for
    # non-API projects on standard while enforcing backward-compatibility for API-exposing backends
    # (e.g. FastAPI). Promoted from enterprise-only per brief #2 P0-1 — see CHANGELOG 0.13.0.
    # Position: contract-clear closes at MR2 (the merge-reviewer join, right after the build-green
    # lanes and BEFORE the test/security stages) — see the Gate ↔ Stage map in agents/orchestrator.md.
    gates: [spec-complete, em-approved, code-review, build-green, contract-clear, test-coverage, security-clear]
    # NOTE: the agent-side capture hooks (capture-learnings / -catchup / -stop) are deliberately NOT
    # listed here — they are installed by the init-time `capture_mode` choice via catalog/capture.yaml
    # (see catalog._apply_capture_mode), not by profile membership. load-learnings (recall) stays.
    # capture-ticket-telemetry rides with the ticketing-and-traceability skill above: it is unrelated
    # to capture_mode, self-throttles, and no-ops until a ticket store exists.
    hooks: [load-continuity, verify-continuity-writeback, load-learnings, load-autonomy, guard-rm-rf, guard-push-main, guard-destructive-git, protect-secrets, guard-commit-secrets, warn-shared-modules, warn-llm-io, lint-fix, type-check, capture-ticket-telemetry]

  enterprise:
    label: "Enterprise — adds DevOps, Observability, full audit + acceptance"
    inherit: standard
    agents:
      - devops-engineer
      - observability-engineer
      - auditor
      - incident-responder
      - risk-classifier
    # ENUMERATED, not `all`. `skills: all` used to mean "every directory in skills/", which made the
    # richest profile the least targeted one: a Go service with no frontend and no database still
    # received React, FastAPI and Alembic skills — ~55k lines of content for a stack the project
    # does not use, all of it competing in the skill picker. Everything stack-flavored now rides
    # catalog/stacks.yaml's `skills:` union instead (installed only when that stack is selected),
    # and what remains here is what an enterprise pipeline needs regardless of stack.
    #
    # Adding a skill to the payload therefore no longer installs it by default — name it in a
    # profile (stack-agnostic) or in a stacks.yaml union (stack-specific). That is the point:
    # membership is a decision, not a side effect of creating a directory.
    skills:
      # Operate / run: the stages enterprise adds over standard (pipeline-green, observability-ready).
      - ci-cd-and-automation
      - observability-and-logging
      - otel-tracing
      - grafana-dashboards-and-alerts
      - kubectl-operations
      - kubernetes-workload-hardening
      - containerization-and-deployment
      - docker-compose
      - docker-shared
      - gcp-cloud-run-github-actions
      - cron-and-scheduled-jobs
      # Design / architecture reference used by technical-architect and the auditor.
      - design-patterns-and-conventions
      - distributed-systems-patterns
      - object-oriented-design
      - system-design-patterns
      - safety-critical-patterns
      - multi-tenancy-patterns
      - edge-to-service-trust-boundary
      - auth-and-rbac
      - api-pagination-filtering-sorting
      - graphql-patterns
      - redis-caching-patterns
      - notifications-and-messaging
      - file-export-and-reporting
      # Change management: the auditor / risk-classifier surface.
      - dependency-verification
      - deprecation-and-migration
      - modernization-and-migration
      - library-review
      - shell-review
      # Data / eventing platforms.
      - kafka-config-driven
      - temporal-config-driven
      - temporal-developer
      - data-engineering-bigquery-gcs
      - gcs-file-storage-patterns
      # LLM-product engineering.
      - anthropic-vertex-integration
      - langfuse-llm-tracing
      - llm-caching-strategies
      - llm-gateway-and-routing
      - llm-inference-optimization
      - rag-and-model-tuning
      # Delivery workflow.
      - sprint
      - backlog
      - archive-sprint
      - triage
      - shipping-and-launch
      - consolidate-learnings
      - doc-consolidation
      - playwright-verification
    gates: [spec-complete, em-approved, code-review, build-green, contract-clear, test-coverage, security-clear, pipeline-green, observability-ready, acceptance]
    hooks: all
