name: Publish verified distributions

# The preflight authenticates repository, event, branch, conclusion, run ID, and head SHA before
# checking out or executing source from the completed run.
on: # zizmor: ignore[dangerous-triggers]
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful main-branch CI run containing verified-dist
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-claude-code-kit
  cancel-in-progress: false

jobs:
  preflight:
    name: Authenticate CI run and release artifact
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      run_id: ${{ steps.run.outputs.run_id }}
      sha: ${{ steps.run.outputs.sha }}
      version: ${{ steps.metadata.outputs.version }}
      pypi_status: ${{ steps.registry.outputs.status }}
    steps:
      - id: run
        name: Require a successful main push CI run from this repository
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
          EVENT_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          case "$SOURCE_RUN_ID" in
            ''|*[!0-9]*) echo "::error::run_id must be numeric"; exit 1 ;;
          esac
          gh api "repos/$REPOSITORY/actions/runs/$SOURCE_RUN_ID" > run.json
          python - <<'PY'
          import json, os, re
          run = json.load(open("run.json", encoding="utf-8"))
          expected = {
              "name": "CI",
              "conclusion": "success",
              "head_branch": "main",
              "event": "push",
          }
          bad = {key: (run.get(key), value) for key, value in expected.items() if run.get(key) != value}
          repository = (run.get("head_repository") or {}).get("full_name")
          if repository != os.environ["REPOSITORY"]:
              bad["head_repository"] = (repository, os.environ["REPOSITORY"])
          sha = run.get("head_sha", "")
          if not re.fullmatch(r"[0-9a-f]{40}", sha):
              bad["head_sha"] = (sha, "40 lowercase hex characters")
          event_sha = os.environ.get("EVENT_HEAD_SHA")
          if event_sha and event_sha != sha:
              bad["event_head_sha"] = (event_sha, sha)
          if bad:
              raise SystemExit(f"untrusted/ineligible CI run: {bad}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"run_id={run['id']}\nsha={sha}\n")
          PY
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ steps.run.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: verified-dist
          path: verified
          run-id: ${{ steps.run.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Verify artifact and CI-generated metadata
        run: |
          python scripts/release_preflight.py verify --dist-dir verified/dist
          cp verified/dist/SHA256SUMS verified/CI-SHA256SUMS
          python scripts/release_preflight.py prepare \
            --dist-dir verified/dist --notes-output verified/recomputed-release-notes.md
          cmp verified/CI-SHA256SUMS verified/dist/SHA256SUMS
          cmp verified/release-notes.md verified/recomputed-release-notes.md
      - id: metadata
        name: Export version from validated project metadata
        run: >-
          python scripts/release_preflight.py prepare
          --dist-dir verified/dist --notes-output verified/recomputed-release-notes.md
      - id: registry
        name: Require PyPI to be absent or byte-identical
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
        run: python scripts/release_preflight.py pypi-status --version "$VERSION" --dist-dir verified/dist

  attest:
    name: Attest exact CI artifacts
    needs: preflight
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: verified-dist
          path: verified
          run-id: ${{ needs.preflight.outputs.run_id }}
          github-token: ${{ github.token }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: verified/dist/*

  publish:
    name: Publish exact CI wheel and sdist to PyPI
    needs: [preflight, attest]
    if: needs.preflight.outputs.pypi_status == 'missing'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: verified-dist
          path: verified
          run-id: ${{ needs.preflight.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Recheck digest and isolate uploadable distributions
        run: |
          cd verified/dist
          sha256sum --check SHA256SUMS
          mkdir ../../publish-dist
          cp ./*.whl ./*.tar.gz ../../publish-dist/
      - name: Trusted publish of exact distributions
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: publish-dist
          attestations: true

  verify-pypi:
    name: Download PyPI files and verify CI digests
    needs: [preflight, attest, publish]
    if: >-
      always() && needs.preflight.result == 'success' && needs.attest.result == 'success' &&
      (needs.preflight.outputs.pypi_status == 'identical' || needs.publish.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.preflight.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: verified-dist
          path: verified
          run-id: ${{ needs.preflight.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Verify registry metadata and downloaded bytes
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          python scripts/release_preflight.py verify --dist-dir verified/dist
          python scripts/release_preflight.py verify-published \
            --version "$VERSION" --dist-dir verified/dist --download-dir pypi-download

  github-release:
    name: Tag exact commit and attach exact verified artifacts
    needs: [preflight, verify-pypi]
    if: needs.verify-pypi.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.preflight.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: verified-dist
          path: verified
          run-id: ${{ needs.preflight.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Create or recover release at the verified commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          VERIFIED_SHA: ${{ needs.preflight.outputs.sha }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          python scripts/release_preflight.py verify --dist-dir verified/dist
          tag="v$VERSION"
          tag_ref="refs/tags/$tag"
          if ! git ls-remote --exit-code --tags origin "$tag_ref" >/dev/null 2>&1; then
            # Create the lightweight tag first. A racing creator may make this
            # request fail with 422; the authoritative fetch + SHA check below
            # decides whether recovery is safe in either case.
            gh api --method POST "repos/$REPOSITORY/git/refs" \
              -f ref="$tag_ref" -f sha="$VERIFIED_SHA" || true
          fi
          git fetch --force origin "$tag_ref:$tag_ref"
          test "$(git rev-list -n 1 "$tag")" = "$VERIFIED_SHA" || {
            echo "::error::$tag exists at a different commit"
            exit 1
          }
          if gh release view "$tag" --repo "$REPOSITORY" >/dev/null 2>&1; then
            gh release view "$tag" --repo "$REPOSITORY" --json assets > release-assets.json
            python scripts/release_preflight.py verify-release-assets \
              --dist-dir verified/dist --assets-json release-assets.json --allow-missing
            gh release upload "$tag" --repo "$REPOSITORY" --clobber \
              verified/dist/*.whl verified/dist/*.tar.gz verified/dist/SHA256SUMS
          else
            gh release create "$tag" --repo "$REPOSITORY" \
              --title "$tag" --notes-file verified/release-notes.md \
              verified/dist/*.whl verified/dist/*.tar.gz verified/dist/SHA256SUMS
          fi
          gh release view "$tag" --repo "$REPOSITORY" --json assets > release-assets.json
          python scripts/release_preflight.py verify-release-assets \
            --dist-dir verified/dist --assets-json release-assets.json
