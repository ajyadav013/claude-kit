name: Publish to PyPI

# Publishes claude-code-kit to PyPI via Trusted Publishing (OIDC) — no API token needed.
#
# Triggers: every push to `main` (i.e. every merge), every version tag (e.g. v0.7.0), a published
# GitHub Release, or a manual dispatch. PyPI versions are immutable, so a merge that does NOT bump the
# version cannot be re-uploaded. The `version-check` job below therefore gates the build/publish on
# whether `pyproject.toml`'s version is already on PyPI: a new version publishes, an unchanged version
# is skipped cleanly. Combined with the release rule (bump the version in all four manifests + the
# CHANGELOG), this means "merge to main → publish" whenever — and only when — the version is bumped.
#
# After a successful publish, the `github-release` job creates the matching git tag `vX.Y.Z` and a
# GitHub Release whose body is that version's CHANGELOG section — so the tag/Release ledger stays in
# lockstep with PyPI automatically (no manual `git tag`). It is idempotent: a re-run over an
# already-released version is a clean no-op.
on:
  push:
    branches: ["main"]
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:

jobs:
  version-check:
    name: Check version is new
    runs-on: ubuntu-latest
    outputs:
      should_publish: ${{ steps.check.outputs.should_publish }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: check
        name: Compare pyproject version against PyPI
        run: |
          version="$(grep -E '^version *= *"' pyproject.toml | head -1 | sed -E 's/.*"([^"]+)".*/\1/')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          code="$(curl -s -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/claude-code-kit/$version/json")"
          if [ "$code" = "200" ]; then
            echo "::notice::claude-code-kit $version is already on PyPI (HTTP $code) — skipping publish. Bump the version to release."
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::claude-code-kit $version is not on PyPI (HTTP $code) — will build and publish."
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build distributions
    needs: version-check
    if: needs.version-check.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build wheel + sdist and validate
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: [version-check, build]
    if: needs.version-check.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    # The trusted publisher on PyPI must reference: workflow `publish.yml` and (if set) environment `pypi`.
    environment: pypi
    permissions:
      id-token: write   # required for OIDC trusted publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Belt-and-suspenders against the immutable-version race: if the version somehow already
          # exists at upload time, skip instead of failing the run (the version-check job already
          # gates this, but two merges in flight could both pass the check).
          skip-existing: true
          # PEP 740 attestations are enabled (this is also the action's default; set explicitly to
          # document intent). They were temporarily disabled in an earlier release while Sigstore's
          # Rekor transparency log was returning HTTP 502s at upload time. Sigstore has since been
          # healthy (status.sigstore.dev reported all services online with no incidents), so signed
          # build attestations are re-enabled here for supply-chain provenance. If Rekor flakes again,
          # flip this back to false to unblock a release, then re-enable once it recovers.
          attestations: true

  github-release:
    name: Tag + GitHub Release
    needs: [version-check, publish]
    if: needs.version-check.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # required to create the git tag and the GitHub Release
    steps:
      - uses: actions/checkout@v7
      - name: Create tag + Release from the CHANGELOG section
        # `version` comes from version-check (parsed from pyproject.toml — repo-controlled, not event
        # input) but is passed through `env` rather than interpolated into the script body as a matter of
        # workflow-injection hygiene. GH_TOKEN authenticates the `gh` CLI to create the tag + Release.
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version-check.outputs.version }}
        run: |
          tag="v$VERSION"
          # Idempotent: on a re-run the Release already exists, so do nothing (a second create would fail).
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::notice::Release $tag already exists — nothing to do."
            exit 0
          fi
          # Pull this version's CHANGELOG section: the lines between its `## [x.y.z]` heading and the next
          # `## [` heading (heading lines themselves excluded — the Release title already carries the tag).
          awk -v ver="$VERSION" '
            index($0, "## [" ver "]") == 1 { capture = 1; next }
            capture && index($0, "## [") == 1 { exit }
            capture { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ] || ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::warning::No CHANGELOG section found for $VERSION — using a generic Release note."
            printf 'Release %s. See CHANGELOG.md for details.\n' "$tag" > release-notes.md
          fi
          # `gh release create` creates the annotated tag on the checked-out commit (main's merge commit)
          # and publishes the Release in one step.
          gh release create "$tag" --title "$tag" --notes-file release-notes.md
          echo "::notice::Created git tag and GitHub Release $tag."
