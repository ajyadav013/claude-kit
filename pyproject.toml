[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "claude-code-kit"
version = "0.84.0"
description = "Evidence-gated, stack-agnostic SDLC configuration for Claude Code (stable) and Codex (Preview), with native ckit init --runtime claude|codex|both projections and one shared gate ledger."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Arjunsingh Yadav" }]
keywords = [
  "claude",
  "claude-code",
  "codex",
  "openai-codex",
  "sdlc",
  "agents",
  "agentic",
  "orchestration",
  "code-review",
  "testing",
  "automation",
  "scaffold",
  "generator",
  "cookiecutter",
  "fastapi",
  "react",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development",
  "Topic :: Software Development :: Quality Assurance",
  "Environment :: Console",
]
dependencies = [
  "typer>=0.12",
  "jinja2>=3.1",
  "pyyaml>=6.0",
  "jsonschema>=4.0",
  "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
# Backward-compatible alias; JSON Schema validation is runtime-required as of 0.83.0.
schema = [
  "jsonschema>=4.0",
]
dev = [
  "pytest>=9.1.1",
  "pytest-xdist>=3.8.0,<4",
  "build>=1.6.0",
  "hatchling>=1.32.0",
  "twine>=7.0.0",
  "ruff>=0.16.5",
  "mypy>=2.3.1",
  "shellcheck-py>=0.11.0.1",
  "jsonschema>=4.0",
]

[project.urls]
Homepage = "https://github.com/ajyadav013/claude-kit"
Repository = "https://github.com/ajyadav013/claude-kit"
Issues = "https://github.com/ajyadav013/claude-kit/issues"

[project.scripts]
claude-kit = "claude_kit.cli:main"
ckit = "claude_kit.cli:main"
claude-sdlc = "claude_kit.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py39"
# Scenario fixtures, sealed holdouts and reference solutions are DATA, not this project's code. They
# are copied into a scenario workspace and executed there, and spec behaviours match against their
# source TEXT — so reformatting or import-sorting them could silently change what a check matches.
# Same reasoning as `collect_ignore_glob` in tests/evals/e2e/conftest.py.
extend-exclude = [
  "tests/evals/e2e/fixtures",
  "tests/evals/e2e/holdouts",
  "tests/evals/e2e/solutions",
]

[tool.ruff.lint]
# Deliberately conservative: pyflakes (F) + the actionable pycodestyle subsets (E4/E7/E9, W) +
# import sorting (I) + bugbear (B). Line length (E501) is intentionally NOT enforced — docstrings and
# pinned-version comments run long on purpose and `ruff format` owns layout.
select = ["E4", "E7", "E9", "F", "W", "I", "B"]

[tool.mypy]
files = ["src/claude_kit"]
ignore_missing_imports = true
# typer/yaml ship without type stubs; we check our own code, not third-party signatures.

[tool.hatch.build.targets.wheel]
packages = ["src/claude_kit"]

# Bundle the kit payload (read by the pip CLI via importlib.resources) into the wheel.
# The same directories are read directly by Claude Code and Codex when installed as a plugin.
[tool.hatch.build.targets.wheel.force-include]
"agents" = "claude_kit/_payload/agents"
"skills" = "claude_kit/_payload/skills"
"rules" = "claude_kit/_payload/rules"
"hooks" = "claude_kit/_payload/hooks"
"commands" = "claude_kit/_payload/commands"
"canonical" = "claude_kit/_payload/canonical"
"templates" = "claude_kit/_payload/templates"
"catalog" = "claude_kit/_payload/catalog"
"schemas" = "claude_kit/_payload/schemas"
".claude-plugin" = "claude_kit/_payload/.claude-plugin"
"providers" = "claude_kit/_payload/providers"
".agents/plugins/marketplace.json" = "claude_kit/_payload/.agents/plugins/marketplace.json"
"AGENTS.md" = "claude_kit/_payload/AGENTS.md"

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/agents",
  "/skills",
  "/rules",
  "/hooks",
  "/commands",
  "/canonical",
  "/templates",
  "/catalog",
  "/schemas",
  "/scripts",
  "/docs",
  "/.claude-plugin",
  "/providers",
  "/.agents/plugins/marketplace.json",
  "/AGENTS.md",
  "/README.md",
  "/CHANGELOG.md",
  "/CONTRIBUTING.md",
  "/LICENSE",
  "/CLAUDE.md",
]
